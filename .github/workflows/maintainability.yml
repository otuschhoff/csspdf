name: quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.26.6', '1.27.x']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: |
            go.sum
            third_party/gofpdf/go.sum

      - name: Run quality gates
        env:
          GOTOOLCHAIN: local
          RUN_VULN_CHECK: ${{ matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26.6' }}
        run: scripts/check-quality.sh

  race:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            go.sum
            third_party/gofpdf/go.sum

      - name: Run race detector
        env:
          GOTOOLCHAIN: local
        run: |
          go test -race ./... -count=1
          (cd third_party/gofpdf && go test -race ./... -count=1)

  maintainability:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: go.sum

      - name: Install gocyclo
        env:
          GOTOOLCHAIN: local
        run: go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0

      - name: Validate workflow definitions
        env:
          GOTOOLCHAIN: local
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

      - name: Enforce maintainability budgets
        env:
          GOTOOLCHAIN: local
          CHECK_SCOPE: changed
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check-maintainability.sh
